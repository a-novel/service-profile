name: release

# Releases are cut from the GitHub UI (Actions > release > Run) or by the release
# train, which dispatches this workflow. `plan` rehearses with no credential; `cut`
# runs in the protected `release` environment, the "who can publish" gate whose key
# only it reads, and pushes the version commit, the tag and the GitHub Release as
# the release App.
#
# The tag then runs main.yaml, whose build jobs build and push the release's images
# as pull requests build them, and whose tag-only jobs publish the JS package and
# dispatch the pin. Only the release App and admins can create a tag, so one approval
# covers the release, and a hotfix tag publishes its line the same way.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bump and report only: no commit, tag, push or release"
        required: false
        type: boolean
        default: false

run-name: "${{ format('🚀 release {0}{1}', github.ref_name, inputs.dry_run && ' (dry-run)' || '') }}"

# plan and cut run release-core with this CLI version.
env:
  # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
  cli_version: "1.43.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.core.outputs.tag }}
    steps:
      - id: core
        uses: a-novel-kit/workflows/publish-actions/release-core@v1.87.1
        with:
          cli_version: ${{ env.cli_version }}
          dry_run: "true"

  # GitHub's release-notes endpoint wants contents write although it stores nothing, so this job
  # holds that token alone and runs no repository code. `cut` waits for it, so whoever approves the
  # cut has read the notes.
  notes:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preview the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body >> "$GITHUB_STEP_SUMMARY"

  cut:
    needs: [plan, notes]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.87.1
        with:
          cli_version: ${{ env.cli_version }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
